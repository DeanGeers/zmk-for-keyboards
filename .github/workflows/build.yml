name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      build-matrix: |
        {
          "include": [
            {"board": "nice_nano_v2", "shield": "sofle_left"},
            {"board": "nice_nano_v2", "shield": "sofle_right"}
          ]
        }
